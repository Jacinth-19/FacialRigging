name: CI
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev xorg-dev python3
      - run: cmake -S . -B build -G Ninja
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: build/fr_cli --output out/scene --format glb --variations 2
      - run: python3 tools/run_arena_task.py tools/arena_task.yaml
